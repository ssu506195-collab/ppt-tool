<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">彈性方塊朝左撞擊背面固定的擋塊</title><desc id="desc">原創教學示意，非 ANSYS 求解結果。彈性方塊朝左撞擊背面固定的擋塊</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#dce3d7"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#879e8d" stroke-width="2"/></pattern><linearGradient id="legend"><stop stop-color="#81bfe1"/><stop offset=".5" stop-color="#b9d4a0"/><stop offset="1" stop-color="#ed9c69"/></linearGradient></defs><rect width="800" height="390" rx="20" fill="#faf9f0"/><rect width="800" height="390" fill="url(#dots)" rx="20"/><g font-family="Microsoft JhengHei, sans-serif"><text x="28" y="40" fill="#244c3b" font-size="23" font-weight="700" text-anchor="start">兩個實體、一個間隙、明確的速度方向</text><rect x="85" y="135" width="72" height="150" rx="4" fill="#a4b89d" stroke="#b8cdbb" stroke-width="1.6"/><rect x="180" y="174" width="470" height="73" rx="4" fill="#b7d5e6" stroke="#b8cdbb" stroke-width="1.6"/><rect x="62" y="132" width="19" height="156" fill="url(#hatch)" stroke="#7d9a7f"/><text x="77" y="112" fill="#244c3b" font-size="15" font-weight="500" text-anchor="start">固定背面</text><text x="91" y="317" fill="#244c3b" font-size="16" font-weight="500" text-anchor="start">擋塊</text><text x="390" y="280" fill="#244c3b" font-size="17" font-weight="500" text-anchor="start">運動方塊</text><path d="M500 146L290 146" fill="none" stroke="#b96f46" stroke-width="2" /><path d="M297.20 142.52L290 146L297.20 149.48" fill="none" stroke="#b96f46" stroke-width="2"/><text x="332" y="127" fill="#244c3b" font-size="18" font-weight="500" text-anchor="start">VX = −1 m/s</text><path d="M160 332L180 332" fill="none" stroke="#b96f46" stroke-width="2" /><text x="150" y="360" fill="#244c3b" font-size="14" font-weight="500" text-anchor="start">間隙 1 mm</text><text x="28" y="382" fill="#244c3b" font-size="11" font-weight="500" text-anchor="start">兩者皆為可變形線彈性實體；圖未按實際比例繪製。</text></g></svg>