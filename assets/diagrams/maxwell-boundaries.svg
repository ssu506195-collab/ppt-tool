<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">理想間隙的兩條電壓邊與兩條 Neumann 側邊</title><desc id="desc">原創教學示意，非 ANSYS 求解結果。理想間隙的兩條電壓邊與兩條 Neumann 側邊</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#dce3d7"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#879e8d" stroke-width="2"/></pattern><linearGradient id="legend"><stop stop-color="#81bfe1"/><stop offset=".5" stop-color="#b9d4a0"/><stop offset="1" stop-color="#ed9c69"/></linearGradient></defs><rect width="800" height="390" rx="20" fill="#faf9f0"/><rect width="800" height="390" fill="url(#dots)" rx="20"/><g font-family="Microsoft JhengHei, sans-serif"><text x="28" y="40" fill="#244c3b" font-size="23" font-weight="700" text-anchor="start">上、下給電壓；左右保留零法向通量</text><rect x="150" y="112" width="500" height="160" rx="0" fill="#e9f3f8" stroke="#b8cdbb" stroke-width="1.6"/><path d="M150 112L650 112" fill="none" stroke="#c47d4c" stroke-width="2" /><path d="M150 272L650 272" fill="none" stroke="#689ab6" stroke-width="2" /><text x="200" y="92" fill="#244c3b" font-size="18" font-weight="500" text-anchor="start">y = 10 mm：1000 V</text><text x="220" y="309" fill="#244c3b" font-size="18" font-weight="500" text-anchor="start">y = 0：0 V</text><path d="M235 140L235 240" fill="none" stroke="#5b8e72" stroke-width="2" /><path d="M231.52 232.80L235 240L238.48 232.80" fill="none" stroke="#5b8e72" stroke-width="2"/><path d="M345 140L345 240" fill="none" stroke="#5b8e72" stroke-width="2" /><path d="M341.52 232.80L345 240L348.48 232.80" fill="none" stroke="#5b8e72" stroke-width="2"/><path d="M455 140L455 240" fill="none" stroke="#5b8e72" stroke-width="2" /><path d="M451.52 232.80L455 240L458.48 232.80" fill="none" stroke="#5b8e72" stroke-width="2"/><path d="M565 140L565 240" fill="none" stroke="#5b8e72" stroke-width="2" /><path d="M561.52 232.80L565 240L568.48 232.80" fill="none" stroke="#5b8e72" stroke-width="2"/><text x="17" y="180" fill="#244c3b" font-size="13" font-weight="500" text-anchor="start">Neumann</text><text x="17" y="203" fill="#244c3b" font-size="13" font-weight="500" text-anchor="start">不穿出</text><text x="665" y="180" fill="#244c3b" font-size="13" font-weight="500" text-anchor="start">Neumann</text><text x="665" y="203" fill="#244c3b" font-size="13" font-weight="500" text-anchor="start">不穿出</text><text x="256" y="355" fill="#244c3b" font-size="16" font-weight="500" text-anchor="start">真空介質：40 × 10 mm</text><text x="28" y="382" fill="#244c3b" font-size="11" font-weight="500" text-anchor="start">教學幾何示意；不是在有限銅板外包一個接地空氣盒。</text></g></svg>