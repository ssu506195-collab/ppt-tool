<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">顯式求解時間步與結果輸出影格的區別</title><desc id="desc">原創教學示意，非 ANSYS 求解結果。顯式求解時間步與結果輸出影格的區別</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#dce3d7"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#879e8d" stroke-width="2"/></pattern><linearGradient id="legend"><stop stop-color="#81bfe1"/><stop offset=".5" stop-color="#b9d4a0"/><stop offset="1" stop-color="#ed9c69"/></linearGradient></defs><rect width="800" height="390" rx="20" fill="#faf9f0"/><rect width="800" height="390" fill="url(#dots)" rx="20"/><g font-family="Microsoft JhengHei, sans-serif"><text x="28" y="40" fill="#244c3b" font-size="23" font-weight="700" text-anchor="start">求解很多小步，只存其中一些畫面</text><path d="M70 145L730 145" fill="none" stroke="#789184" stroke-width="2" /><circle cx="75" cy="145" r="4" fill="#87ae8d"/><circle cx="96" cy="145" r="4" fill="#87ae8d"/><circle cx="117" cy="145" r="4" fill="#87ae8d"/><circle cx="138" cy="145" r="4" fill="#87ae8d"/><circle cx="159" cy="145" r="4" fill="#87ae8d"/><circle cx="180" cy="145" r="4" fill="#87ae8d"/><circle cx="201" cy="145" r="4" fill="#87ae8d"/><circle cx="222" cy="145" r="4" fill="#87ae8d"/><circle cx="243" cy="145" r="4" fill="#87ae8d"/><circle cx="264" cy="145" r="4" fill="#87ae8d"/><circle cx="285" cy="145" r="4" fill="#87ae8d"/><circle cx="306" cy="145" r="4" fill="#87ae8d"/><circle cx="327" cy="145" r="4" fill="#87ae8d"/><circle cx="348" cy="145" r="4" fill="#87ae8d"/><circle cx="369" cy="145" r="4" fill="#87ae8d"/><circle cx="390" cy="145" r="4" fill="#87ae8d"/><circle cx="411" cy="145" r="4" fill="#87ae8d"/><circle cx="432" cy="145" r="4" fill="#87ae8d"/><circle cx="453" cy="145" r="4" fill="#87ae8d"/><circle cx="474" cy="145" r="4" fill="#87ae8d"/><circle cx="495" cy="145" r="4" fill="#87ae8d"/><circle cx="516" cy="145" r="4" fill="#87ae8d"/><circle cx="537" cy="145" r="4" fill="#87ae8d"/><circle cx="558" cy="145" r="4" fill="#87ae8d"/><circle cx="579" cy="145" r="4" fill="#87ae8d"/><circle cx="600" cy="145" r="4" fill="#87ae8d"/><circle cx="621" cy="145" r="4" fill="#87ae8d"/><circle cx="642" cy="145" r="4" fill="#87ae8d"/><circle cx="663" cy="145" r="4" fill="#87ae8d"/><circle cx="684" cy="145" r="4" fill="#87ae8d"/><circle cx="705" cy="145" r="4" fill="#87ae8d"/><text x="70" y="120" fill="#244c3b" font-size="18" font-weight="700" text-anchor="start">求解步（示意）</text><path d="M70 245L730 245" fill="none" stroke="#789184" stroke-width="2" /><circle cx="75" cy="245" r="9" fill="#d9a06b"/><circle cx="285" cy="245" r="9" fill="#d9a06b"/><circle cx="495" cy="245" r="9" fill="#d9a06b"/><circle cx="705" cy="245" r="9" fill="#d9a06b"/><text x="70" y="220" fill="#244c3b" font-size="18" font-weight="700" text-anchor="start">輸出影格（示意）</text><text x="70" y="320" fill="#244c3b" font-size="16" font-weight="500" text-anchor="start">存得更密，才能看見更多歷程；但不等於求解步長變小。</text><text x="28" y="378" fill="#244c3b" font-size="12" font-weight="500" text-anchor="start">時間尺度、點數與間距只是示意，不是通用求解參數。</text></g></svg>