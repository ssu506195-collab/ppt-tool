<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">二維平行板流體面與入口出口壁面</title><desc id="desc">原創教學示意，非 ANSYS 求解結果。二維平行板流體面與入口出口壁面</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#dce3d7"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#879e8d" stroke-width="2"/></pattern><linearGradient id="legend"><stop stop-color="#81bfe1"/><stop offset=".5" stop-color="#b9d4a0"/><stop offset="1" stop-color="#ed9c69"/></linearGradient></defs><rect width="800" height="390" rx="20" fill="#faf9f0"/><rect width="800" height="390" fill="url(#dots)" rx="20"/><g font-family="Microsoft JhengHei, sans-serif"><text x="28" y="40" fill="#244c3b" font-size="23" font-weight="700" text-anchor="start">長方形的內部，就是流體所在的位置</text><rect x="140" y="117" width="515" height="140" rx="0" fill="#e6f3fa" stroke="#b8cdbb" stroke-width="1.6"/><path d="M140 115L655 115" fill="none" stroke="#4f745a" stroke-width="2" /><path d="M140 260L655 260" fill="none" stroke="#4f745a" stroke-width="2" /><text x="245" y="96" fill="#244c3b" font-size="18" font-weight="500" text-anchor="start">Wall（無滑移）</text><text x="245" y="292" fill="#244c3b" font-size="18" font-weight="500" text-anchor="start">Wall（無滑移）</text><path d="M54 145L132 145" fill="none" stroke="#6b9db8" stroke-width="2" /><path d="M124.80 148.48L132 145L124.80 141.52" fill="none" stroke="#6b9db8" stroke-width="2"/><path d="M54 185L132 185" fill="none" stroke="#6b9db8" stroke-width="2" /><path d="M124.80 188.48L132 185L124.80 181.52" fill="none" stroke="#6b9db8" stroke-width="2"/><path d="M54 225L132 225" fill="none" stroke="#6b9db8" stroke-width="2" /><path d="M124.80 228.48L132 225L124.80 221.52" fill="none" stroke="#6b9db8" stroke-width="2"/><path d="M662 145L734 145" fill="none" stroke="#b78d5c" stroke-width="2" /><path d="M726.80 148.48L734 145L726.80 141.52" fill="none" stroke="#b78d5c" stroke-width="2"/><path d="M662 185L734 185" fill="none" stroke="#b78d5c" stroke-width="2" /><path d="M726.80 188.48L734 185L726.80 181.52" fill="none" stroke="#b78d5c" stroke-width="2"/><path d="M662 225L734 225" fill="none" stroke="#b78d5c" stroke-width="2" /><path d="M726.80 228.48L734 225L726.80 221.52" fill="none" stroke="#b78d5c" stroke-width="2"/><text x="32" y="100" fill="#244c3b" font-size="14" font-weight="500" text-anchor="start">速度入口</text><text x="669" y="100" fill="#244c3b" font-size="14" font-weight="500" text-anchor="start">壓力出口</text><text x="261" y="194" fill="#244c3b" font-size="19" font-weight="700" text-anchor="start">流體域・Planar（平面）</text><text x="80" y="340" fill="#244c3b" font-size="15" font-weight="500" text-anchor="start">長度 1 m、間隙 10 mm；不是實心管壁，也不是圓管截面。</text><text x="28" y="380" fill="#244c3b" font-size="12" font-weight="500" text-anchor="start">繪圖縱向放大，未按細長比繪製；不含數值求解資料。</text></g></svg>