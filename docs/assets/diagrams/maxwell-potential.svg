<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">理想平行板的電位色帶與向下電場</title><desc id="desc">原創教學示意，非 ANSYS 求解結果。理想平行板的電位色帶與向下電場</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#dce3d7"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#879e8d" stroke-width="2"/></pattern><linearGradient id="legend"><stop stop-color="#81bfe1"/><stop offset=".5" stop-color="#b9d4a0"/><stop offset="1" stop-color="#ed9c69"/></linearGradient></defs><rect width="800" height="390" rx="20" fill="#faf9f0"/><rect width="800" height="390" fill="url(#dots)" rx="20"/><g font-family="Microsoft JhengHei, sans-serif"><text x="28" y="40" fill="#244c3b" font-size="23" font-weight="700" text-anchor="start">電位看高度，電場看空間變化</text><rect x="70" y="100" width="500" height="17" rx="0" fill="rgb(233,161,106)" stroke="rgb(233,161,106)" stroke-width="1.6"/><rect x="70" y="117" width="500" height="17" rx="0" fill="rgb(223,165,117)" stroke="rgb(223,165,117)" stroke-width="1.6"/><rect x="70" y="134" width="500" height="17" rx="0" fill="rgb(213,169,128)" stroke="rgb(213,169,128)" stroke-width="1.6"/><rect x="70" y="151" width="500" height="17" rx="0" fill="rgb(203,173,139)" stroke="rgb(203,173,139)" stroke-width="1.6"/><rect x="70" y="168" width="500" height="17" rx="0" fill="rgb(193,177,150)" stroke="rgb(193,177,150)" stroke-width="1.6"/><rect x="70" y="185" width="500" height="17" rx="0" fill="rgb(183,181,161)" stroke="rgb(183,181,161)" stroke-width="1.6"/><rect x="70" y="202" width="500" height="17" rx="0" fill="rgb(173,185,172)" stroke="rgb(173,185,172)" stroke-width="1.6"/><rect x="70" y="219" width="500" height="17" rx="0" fill="rgb(163,189,183)" stroke="rgb(163,189,183)" stroke-width="1.6"/><rect x="70" y="236" width="500" height="17" rx="0" fill="rgb(153,193,194)" stroke="rgb(153,193,194)" stroke-width="1.6"/><rect x="70" y="253" width="500" height="17" rx="0" fill="rgb(143,197,205)" stroke="rgb(143,197,205)" stroke-width="1.6"/><rect x="70" y="85" width="500" height="15" rx="3" fill="#a96f4f" stroke="#b8cdbb" stroke-width="1.6"/><rect x="70" y="270" width="500" height="15" rx="3" fill="#658aa8" stroke="#b8cdbb" stroke-width="1.6"/><path d="M110 123L110 250" fill="none" stroke="#436e57" stroke-width="2" /><path d="M106.52 242.80L110 250L113.48 242.80" fill="none" stroke="#436e57" stroke-width="2"/><path d="M190 123L190 250" fill="none" stroke="#436e57" stroke-width="2" /><path d="M186.52 242.80L190 250L193.48 242.80" fill="none" stroke="#436e57" stroke-width="2"/><path d="M270 123L270 250" fill="none" stroke="#436e57" stroke-width="2" /><path d="M266.52 242.80L270 250L273.48 242.80" fill="none" stroke="#436e57" stroke-width="2"/><path d="M350 123L350 250" fill="none" stroke="#436e57" stroke-width="2" /><path d="M346.52 242.80L350 250L353.48 242.80" fill="none" stroke="#436e57" stroke-width="2"/><path d="M430 123L430 250" fill="none" stroke="#436e57" stroke-width="2" /><path d="M426.52 242.80L430 250L433.48 242.80" fill="none" stroke="#436e57" stroke-width="2"/><path d="M510 123L510 250" fill="none" stroke="#436e57" stroke-width="2" /><path d="M506.52 242.80L510 250L513.48 242.80" fill="none" stroke="#436e57" stroke-width="2"/><text x="602" y="108" fill="#244c3b" font-size="17" font-weight="500" text-anchor="start">上板 +V</text><text x="602" y="274" fill="#244c3b" font-size="17" font-weight="500" text-anchor="start">下板 0 V</text><text x="603" y="191" fill="#244c3b" font-size="23" font-weight="700" text-anchor="start">E ↓</text><text x="70" y="330" fill="#244c3b" font-size="16" font-weight="500" text-anchor="start">色帶：電位從高到低；箭頭：電場指向低電位。</text><text x="28" y="375" fill="#244c3b" font-size="12" font-weight="500" text-anchor="start">理想均勻間隙解析示意；不含有限電極邊緣效應。</text></g></svg>