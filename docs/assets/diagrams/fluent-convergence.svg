<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">殘差、質量守恆與物理監測的三向檢查</title><desc id="desc">原創教學示意，非 ANSYS 求解結果。殘差、質量守恆與物理監測的三向檢查</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#dce3d7"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#879e8d" stroke-width="2"/></pattern><linearGradient id="legend"><stop stop-color="#81bfe1"/><stop offset=".5" stop-color="#b9d4a0"/><stop offset="1" stop-color="#ed9c69"/></linearGradient></defs><rect width="800" height="390" rx="20" fill="#faf9f0"/><rect width="800" height="390" fill="url(#dots)" rx="20"/><g font-family="Microsoft JhengHei, sans-serif"><text x="28" y="40" fill="#244c3b" font-size="23" font-weight="700" text-anchor="start">三種檢查，一起看才完整</text><rect x="22" y="88" width="238" height="235" rx="14" fill="#e8f3fa" stroke="#b8cdbb" stroke-width="1.6"/><text x="43" y="136" fill="#244c3b" font-size="25" font-weight="700" text-anchor="start">殘差</text><text x="39" y="187" fill="#244c3b" font-size="14" font-weight="500" text-anchor="start">方程的數值誤差指標</text><text x="39" y="244" fill="#244c3b" font-size="13" font-weight="500" text-anchor="start">有下降嗎？有停滯嗎？</text><rect x="282" y="88" width="238" height="235" rx="14" fill="#eff4de" stroke="#b8cdbb" stroke-width="1.6"/><text x="303" y="136" fill="#244c3b" font-size="25" font-weight="700" text-anchor="start">質量守恆</text><text x="299" y="187" fill="#244c3b" font-size="14" font-weight="500" text-anchor="start">所有邊界的通量收支</text><text x="299" y="244" fill="#244c3b" font-size="13" font-weight="500" text-anchor="start">進來與出去對得上嗎？</text><rect x="542" y="88" width="238" height="235" rx="14" fill="#ffeddb" stroke="#b8cdbb" stroke-width="1.6"/><text x="563" y="136" fill="#244c3b" font-size="25" font-weight="700" text-anchor="start">關注物理量</text><text x="559" y="187" fill="#244c3b" font-size="14" font-weight="500" text-anchor="start">壓降、速度剖面等</text><text x="559" y="244" fill="#244c3b" font-size="13" font-weight="500" text-anchor="start">穩定嗎？細化後仍合理嗎？</text><text x="28" y="368" fill="#244c3b" font-size="13" font-weight="500" text-anchor="start">這是檢查面向圖，不是已通過收斂的曲線或門檻。</text></g></svg>