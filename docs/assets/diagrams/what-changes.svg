<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">幾何、材料與拘束共同影響模態結果</title><desc id="desc">原創教學示意，非 ANSYS 求解結果。幾何、材料與拘束共同影響模態結果</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#dce3d7"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#879e8d" stroke-width="2"/></pattern><linearGradient id="legend"><stop stop-color="#81bfe1"/><stop offset=".5" stop-color="#b9d4a0"/><stop offset="1" stop-color="#ed9c69"/></linearGradient></defs><rect width="800" height="390" rx="20" fill="#faf9f0"/><rect width="800" height="390" fill="url(#dots)" rx="20"/><g font-family="Microsoft JhengHei, sans-serif"><text x="28" y="40" fill="#244c3b" font-size="23" font-weight="700" text-anchor="start">改變模型，就可能改變它的動態特徵</text><rect x="25" y="88" width="235" height="197" rx="14" fill="#eaf3fa" stroke="#b8cdbb" stroke-width="1.6"/><text x="45" y="132" fill="#244c3b" font-size="26" font-weight="700" text-anchor="start">幾何</text><text x="45" y="168" fill="#244c3b" font-size="15" font-weight="500" text-anchor="start">長度、厚度、形狀</text><path d="M50 226L209 226" fill="none" stroke="#458273" stroke-width="2" /><path d="M50 248L153 248" fill="none" stroke="#d08c5c" stroke-width="2" /><rect x="285" y="88" width="235" height="197" rx="14" fill="#fff0df" stroke="#b8cdbb" stroke-width="1.6"/><text x="305" y="132" fill="#244c3b" font-size="26" font-weight="700" text-anchor="start">材料</text><text x="305" y="168" fill="#244c3b" font-size="15" font-weight="500" text-anchor="start">剛性與質量</text><path d="M310 230h20l10-16 13 32 13-32 13 32 13-16h42" fill="none" stroke="#8d7353" stroke-width="3"/><rect x="545" y="88" width="235" height="197" rx="14" fill="#f0edfa" stroke="#b8cdbb" stroke-width="1.6"/><text x="565" y="132" fill="#244c3b" font-size="26" font-weight="700" text-anchor="start">拘束</text><text x="565" y="168" fill="#244c3b" font-size="15" font-weight="500" text-anchor="start">夾持方式與連接</text><rect x="573" y="197" width="17" height="57" fill="url(#hatch)"/><rect x="590" y="218" width="146" height="15" rx="2" fill="#88ad96" stroke="#b8cdbb" stroke-width="1.6"/><text x="28" y="343" fill="#244c3b" font-size="16" font-weight="500" text-anchor="start">所以比較兩個結果前，先確認輸入條件是否相同。</text><text x="28" y="375" fill="#244c3b" font-size="12" font-weight="500" text-anchor="start">教學概念圖 · 不預測任意模型的實際頻率</text></g></svg>