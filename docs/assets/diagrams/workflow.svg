<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">Workbench、DesignModeler 和 Mechanical 各自負責的工作</title><desc id="desc">原創教學示意，非 ANSYS 求解結果。Workbench、DesignModeler 和 Mechanical 各自負責的工作</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#dce3d7"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#879e8d" stroke-width="2"/></pattern><linearGradient id="legend"><stop stop-color="#81bfe1"/><stop offset=".5" stop-color="#b9d4a0"/><stop offset="1" stop-color="#ed9c69"/></linearGradient></defs><rect width="800" height="390" rx="20" fill="#faf9f0"/><rect width="800" height="390" fill="url(#dots)" rx="20"/><g font-family="Microsoft JhengHei, sans-serif"><text x="28" y="40" fill="#244c3b" font-size="23" font-weight="700" text-anchor="start">從輸入條件，到看懂輸出</text><rect x="32" y="82" width="346" height="108" rx="14" fill="#eaf3fa" stroke="#b8cdbb" stroke-width="1.6"/><text x="52" y="111" fill="#7b846e" font-size="14" font-weight="500" text-anchor="start">01</text><text x="52" y="142" fill="#244c3b" font-size="22" font-weight="700" text-anchor="start">Workbench</text><text x="52" y="169" fill="#244c3b" font-size="14" font-weight="500" text-anchor="start">串接分析流程</text><rect x="422" y="82" width="346" height="108" rx="14" fill="#fff0df" stroke="#b8cdbb" stroke-width="1.6"/><text x="442" y="111" fill="#7b846e" font-size="14" font-weight="500" text-anchor="start">02</text><text x="442" y="142" fill="#244c3b" font-size="22" font-weight="700" text-anchor="start">DesignModeler</text><text x="442" y="169" fill="#244c3b" font-size="14" font-weight="500" text-anchor="start">建立案例幾何</text><rect x="32" y="217" width="346" height="108" rx="14" fill="#eff3df" stroke="#b8cdbb" stroke-width="1.6"/><text x="52" y="246" fill="#7b846e" font-size="14" font-weight="500" text-anchor="start">03</text><text x="52" y="277" fill="#244c3b" font-size="22" font-weight="700" text-anchor="start">Mechanical</text><text x="52" y="304" fill="#244c3b" font-size="14" font-weight="500" text-anchor="start">設定網格與拘束</text><rect x="422" y="217" width="346" height="108" rx="14" fill="#f2eafb" stroke="#b8cdbb" stroke-width="1.6"/><text x="442" y="246" fill="#7b846e" font-size="14" font-weight="500" text-anchor="start">04</text><text x="442" y="277" fill="#244c3b" font-size="22" font-weight="700" text-anchor="start">Mechanical</text><text x="442" y="304" fill="#244c3b" font-size="14" font-weight="500" text-anchor="start">查看頻率與振型</text><text x="28" y="376" fill="#244c3b" font-size="12" font-weight="500" text-anchor="start">流程圖是學習導覽，不是 ANSYS 軟體畫面截圖。</text></g></svg>