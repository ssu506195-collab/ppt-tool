<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" role="img" aria-labelledby="title desc"><title id="title">懸臂樑幾何與拘束示意</title><desc id="desc">長二百毫米，寬二十毫米，厚十毫米的長方形樑，一端固定。線條是示意，不是有限元素結果。</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c9d9d1" stroke-width=".7"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#869c90" stroke-width="2"/></pattern><linearGradient id="beam"><stop stop-color="#267058"/><stop offset="1" stop-color="#91b6a2"/></linearGradient></defs><rect width="620" height="280" rx="12" fill="#e8efe9"/><rect width="620" height="280" fill="url(#grid)"/><path d="M89 69l44-23v157l-44 24z" fill="url(#hatch)" stroke="#82978b"/><path d="M133 125l337 43v27l-337-43z" fill="url(#beam)" stroke="#234d3d" stroke-width="2"/><path d="M133 125l42-23 337 43-42 23z" fill="#c0d7c6" stroke="#234d3d" stroke-width="2"/><path d="M470 168l42-23v27l-42 23z" fill="#668c75" stroke="#234d3d" stroke-width="2"/><path d="M140 205l327 42M140 199v12m327 30v12" fill="none" stroke="#385548"/><text x="275" y="247" font-family="sans-serif" font-size="15" fill="#294c3c">L = 200 mm</text><text x="28" y="34" font-family="sans-serif" font-size="13" fill="#385548">FIXED END</text><path d="M94 40l23 24" stroke="#385548"/><text x="389" y="62" font-family="sans-serif" font-size="13" fill="#385548">b = 20 mm · h = 10 mm</text><text x="392" y="88" font-family="sans-serif" font-size="11" fill="#5b7767">GEOMETRY SCHEMATIC</text><path d="M150 121C260 129 363 86 490 42" fill="none" stroke="#ce744a" stroke-width="2" stroke-dasharray="5 6"/><text x="28" y="264" font-family="sans-serif" font-size="10" fill="#5b7767">SCHEMATIC ONLY / NOT A SOLVER RESULT</text></svg>
